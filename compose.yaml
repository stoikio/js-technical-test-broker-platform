name: broker-platform

# Development stack: the source is mounted, so changes reload without a rebuild.
# node_modules live in named volumes to keep the container's Linux binaries apart from the host's.

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  environment:
    CI: 'true'
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  install:
    <<: *node
    command: pnpm install --frozen-lockfile --store-dir /pnpm-store
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/pnpm-store

  api:
    <<: *node
    command: pnpm --filter @broker/api dev
    environment:
      CI: 'true'
      DATABASE_PATH: /data/broker.db
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - api_data:/data
    depends_on:
      install:
        condition: service_completed_successfully

  web:
    <<: *node
    command: pnpm --filter @broker/web dev
    environment:
      CI: 'true'
      API_URL: http://api:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  node_modules:
  api_node_modules:
  web_node_modules:
  pnpm_store:
  api_data:
